# Khylo Server
#
#   docker compose up -d
#
# Update:  docker compose pull && docker compose up -d   (the image is hosted on GitHub: ghcr.io/khylo-org/khylo-server)
#
# Then open http://<this machine>:8096 and follow the setup.
#
# Media on a NAS or another computer: when you add a library, choose "Network share" in the folder
# picker and enter the share (\\nas\Movies for Windows/SMB, nas:/volume1/Movies for NFS). Khylo
# connects it and keeps it connected. Nothing to set up here.

services:
  khylo:
    image: ghcr.io/khylo-org/khylo-server:latest
    build:
      context: ../..
      dockerfile: Source/Packaging/Docker/Dockerfile
    container_name: khylo
    restart: unless-stopped
    ports:
      - "8096:8096"
      # Khylo apps on your network find the server through this UDP port (see "Finding the server" in the README)
      - "7360:7360/udp"
    environment:
      - TZ=America/Chicago
    # Hardware transcoding: give Khylo's user access to the graphics device (Intel / AMD), e.g.
    # group_add:
    #   - video
    #   - render
    # Khylo runs as an ordinary user with no extra privileges. To connect Windows/SMB or NFS network shares from inside
    # Khylo, start it with the extra file next to this one (docker-compose.shares.yml); see the note at the top of it.
    volumes:
      # Settings, users and the library database
      - ./khylo-config:/config
      # Artwork and temporary transcodes; safe to delete
      - ./khylo-cache:/cache
      # Media folders on this machine (optional). "this machine's folder:where Khylo sees it";
      # ":ro" keeps your files safe
      - /path/to/media:/media:ro
    # Hardware transcoding, Intel or AMD graphics (Linux hosts): uncomment
    # devices:
    #   - /dev/dri:/dev/dri
    # Hardware transcoding, NVIDIA graphics (needs the NVIDIA Container Toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
